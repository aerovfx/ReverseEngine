name: a64dbg-macos

on:
  push:
    paths:
      - 'tools/a64dbg/**'
      - '.github/workflows/a64dbg-macos.yml'
  pull_request:
    paths:
      - 'tools/a64dbg/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14   # Apple Silicon (arm64) runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        run: brew install qt

      - name: Configure (debug)
        working-directory: tools/a64dbg
        run: cmake --preset mac-arm64-debug

      - name: Build
        working-directory: tools/a64dbg
        run: cmake --build --preset mac-arm64-debug

      - name: Test (capstone smoke)
        working-directory: tools/a64dbg
        run: ctest --preset mac-arm64-debug

      - name: Sign (adhoc + debugger entitlement)
        working-directory: tools/a64dbg
        run: cmake --build --preset mac-arm64-debug --target sign-a64dbg
